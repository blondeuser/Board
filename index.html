<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REMind</title>
    <script>
      try {
        var t = localStorage.getItem('board.theme')
        document.documentElement.dataset.theme = t === 'concrete-dark' ? t : 'concrete'
      } catch (e) {
        document.documentElement.dataset.theme = 'concrete'
      }
    </script>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
