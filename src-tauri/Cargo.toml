[package]
name = "remind"
version = "0.8.1"
description = "REMind: a local-first moodboard and photo library"
authors = ["REM Studio"]
license = ""
repository = "https://github.com/blondeuser/Board"
edition = "2024"
rust-version = "1.90"

[lib]
name = "remind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset", "unstable"] }
tauri-plugin-http = "2.9.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
tauri-plugin-opener = "2.7.3"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fast_image_resize = "5"
ort = "=2.0.0-rc.15"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Smaller, faster installer binary.
[profile.release]
strip = true
panic = "abort"
lto = "thin"
codegen-units = 16
