[package]
name = "remind"
version = "0.1.1"
description = "REMind: a local-first moodboard and photo library"
authors = ["REM Studio"]
license = ""
repository = "https://github.com/blondeuser/Board"
edition = "2024"
rust-version = "1.90"

[lib]
name = "remind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-http = "2.9.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
tauri-plugin-opener = "2.7.3"

# Smaller, faster installer binary.
[profile.release]
strip = true
panic = "abort"
lto = "thin"
codegen-units = 16
